<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e4fb0">
  <meta name="robots" content="noindex">
  <title>Envio de Documentos · Portal de Admissão</title>
  <meta name="description" content="Envie seus documentos de admissão de forma simples, pelo celular.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231e4fb0'/%3E%3Cpath d='M20 33l8 8 16-17' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/candidato.css">
</head>
<body class="pagina-candidato">
  <header class="cabecalho">
    <div class="cabecalho-interno">
      <a class="marca" href="index.html" aria-label="Portal de Admissão – início">
        <span class="marca-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </span>
        <span class="marca-texto">Portal de <strong>Admissão</strong></span>
      </a>

      <div class="acessibilidade" role="group" aria-label="Acessibilidade">
        <button class="btn-acess" id="btn-letra" type="button" aria-pressed="false" title="Aumentar o tamanho da letra">
          <span class="aa" aria-hidden="true">A<small>A</small></span>
          <span class="btn-acess-texto">Letra maior</span>
        </button>
        <button class="btn-acess" id="btn-contraste" type="button" aria-pressed="false" title="Alto contraste">
          <svg class="icone" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 18a6 6 0 0 0 0-12v12z" fill="currentColor"/></svg>
          <span class="btn-acess-texto">Contraste</span>
        </button>
        <button class="btn-acess" id="btn-sair" type="button" hidden title="Sair">
          <svg class="icone" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          <span class="btn-acess-texto">Sair</span>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite">
    <div class="tela tela-carregando"><span class="spinner" aria-hidden="true"></span><p>Carregando…</p></div>
  </main>

  <footer class="rodape">
    <p>
      <svg class="icone" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Seus documentos são enviados com segurança e só o RH tem acesso.
    </p>
  </footer>

  <!-- Entradas de arquivo (acionadas pelos botões grandes) -->
  <input type="file" id="input-camera" accept="image/*" capture="environment" hidden>
  <input type="file" id="input-arquivo" accept="image/*,application/pdf" hidden>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/candidato.js"></script>
</body>
</html>
